name: Release

on:
  push:
    branches: [main]
  # Lets you re-run a release from the Actions tab after fixing a failed run.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) and automatic provenance.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials stays on (the default) so @semantic-release/git can
      # push the version + changelog commit back to main with GITHUB_TOKEN.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads the pinned version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # Do not set registry-url: it writes an .npmrc auth token that takes
          # precedence over the OIDC exchange and breaks trusted publishing.

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # Trusted publishing needs npm >= 11.5.1; the release log shows what ran.
      - name: Check npm version
        run: node -v && npm -v

      # Analyzes the commits since the last tag, bumps the version, updates
      # CHANGELOG.md, publishes to npm with the OIDC token, creates the GitHub
      # release and commits the version + changelog back to main with [skip ci].
      - name: semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
