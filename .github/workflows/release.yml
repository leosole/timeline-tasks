name: Release

on:
  push:
    branches: [main]
  # Lets you re-run a release from the Actions tab after fixing a failed run.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pinned version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # Analyzes the commits since the last tag, bumps the version, updates
      # CHANGELOG.md, publishes to npm, creates the GitHub release and commits
      # the version + changelog back to main with [skip ci].
      - name: semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
